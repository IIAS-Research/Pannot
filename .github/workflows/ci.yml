name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Pannot
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: python -m pip install build twine uv
      - name: Check the project version in the lock file
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          lock = tomllib.loads(Path("uv.lock").read_text())
          project_name = project["project"]["name"]
          local_packages = [
              package
              for package in lock["package"]
              if package["name"] == project_name
              and package.get("source", {}).get("editable") == "."
          ]
          if len(local_packages) != 1:
              raise SystemExit(
                  f"Expected one editable {project_name!r} package in uv.lock"
              )
          project_version = project["project"]["version"]
          lock_version = local_packages[0]["version"]
          if lock_version != project_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml has {project_version}, "
                  f"uv.lock has {lock_version}"
              )
          PY
      - name: Check the lock file
        run: uv lock --check
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/pannot-smoke"
          "$RUNNER_TEMP/pannot-smoke/bin/python" -m pip install dist/*.whl
      - name: Check the installed package
        run: |
          "$RUNNER_TEMP/pannot-smoke/bin/python" - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pannot import Annotator, OpenAIChatClient

          assert version("pannot")
          prompt_directory = files("pannot").joinpath("prompts")
          required_prompts = {
              "extraction_fr.md",
              "generic_fr.md",
              "local_priority_fr.md",
              "selection_fr.md",
              "text_repair_fr.md",
              "validation_retry_fr.md",
          }
          missing = [
              name
              for name in required_prompts
              if not prompt_directory.joinpath(name).is_file()
          ]
          if missing:
              raise SystemExit(f"Missing packaged prompts: {missing}")
          PY
