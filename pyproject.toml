[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pannot"
version = "0.1.0"
description = "Pseudo-annotation of French clinical documents for training smaller NER models"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
]

[project.urls]
Documentation = "https://iias-research.github.io/Pannot/"
Repository = "https://github.com/IIAS-Research/Pannot"
Issues = "https://github.com/IIAS-Research/Pannot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pannot = ["prompts/*.md"]
